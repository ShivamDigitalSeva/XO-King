<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO King 👑</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:15px;
  background:linear-gradient(135deg,#dbeafe,#ede9fe);
  font-family:Arial,sans-serif;color:#111827
}
.app{max-width:430px;margin:auto}
.card{
  background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;
  box-shadow:0 8px 25px #0001
}
.logo{font-size:55px;text-align:center}
h1{text-align:center;margin:4px 0;font-size:34px}
.sub{text-align:center;color:#64748b;margin-bottom:15px}
.coins{
  text-align:center;background:#fef3c7;padding:10px;border-radius:14px;
  font-weight:bold;margin-bottom:14px
}
input{
  width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:12px;
  font-size:16px;margin:6px 0 10px
}
button{
  width:100%;padding:13px;border:0;border-radius:12px;margin:6px 0;
  font-size:16px;font-weight:bold;cursor:pointer;background:#2563eb;color:white
}
button.secondary{background:#475569}
button.green{background:#16a34a}
button.orange{background:#ea580c}
button:active{transform:scale(.98)}
.hidden{display:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.stat{background:#f1f5f9;padding:10px 4px;border-radius:12px;text-align:center}
.stat b{display:block;font-size:20px}
.stat small{color:#64748b}
.idbox{
  background:#eff6ff;border:1px dashed #60a5fa;padding:10px;
  border-radius:12px;text-align:center;margin-top:10px
}
.levels{display:flex;gap:6px}
.levels button{margin:0;background:#e2e8f0;color:#111827}
.levels button.active{background:#7c3aed;color:#fff}
#status{text-align:center;font-weight:bold;margin:10px}
.board{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  max-width:330px;margin:15px auto
}
.cell{
  aspect-ratio:1;background:#eef2ff;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:55px;font-weight:bold;cursor:pointer
}
.score{display:flex;justify-content:space-around;font-weight:bold;font-size:18px}
#message{text-align:center;font-size:20px;font-weight:bold;min-height:28px}
.lbrow{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px;border-bottom:1px solid #e2e8f0
}
.note{font-size:12px;color:#64748b;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="app">

<section id="home" class="card">
  <div class="logo">👑</div>
  <h1>XO King</h1>
  <div class="sub">Tic-Tac-Toe Game</div>
  <div class="coins">🪙 King Coins: <span id="coins">0</span></div>

  <h3>👤 Player Profile</h3>
  <input id="playerName" maxlength="20" placeholder="अपना नाम लिखें">
  <button onclick="saveName()">नाम Save करें</button>

  <div class="idbox">🆔 Player ID<br><b id="playerId">Connecting...</b></div>

  <div class="stats" style="margin-top:12px">
    <div class="stat"><b id="wins">0</b><small>Wins</small></div>
    <div class="stat"><b id="games">0</b><small>Games</small></div>
    <div class="stat"><b id="best">0</b><small>Best</small></div>
    <div class="stat"><b id="statCoins">0</b><small>Coins</small></div>
  </div>

  <h3>🎮 Computer Difficulty</h3>
  <div class="levels">
    <button id="easy" onclick="setLevel('easy')">Easy</button>
    <button id="medium" onclick="setLevel('medium')">Medium</button>
    <button id="hard" class="active" onclick="setLevel('hard')">Hard</button>
  </div>

  <button onclick="startComputer()">🤖 Computer के साथ खेलें</button>
  <button class="secondary" onclick="startTwoPlayer()">👥 2 Player</button>
  <button class="green" onclick="showLeaderboard()">🏆 Online Leaderboard</button>
  <div id="firebaseStatus" class="note">Firebase connect हो रहा है...</div>
</section>

<section id="game" class="card hidden">
  <button class="secondary" onclick="goHome()">← Home</button>
  <h1>XO King 👑</h1>
  <div class="coins">🪙 <span id="gameCoins">0</span></div>
  <div id="status">X की चाल</div>
  <div class="score"><span>❌ X: <span id="xScore">0</span></span><span>⭕ O: <span id="oScore">0</span></span></div>
  <div id="message"></div>
  <div id="board" class="board"></div>
  <button class="orange" onclick="newGame()">🔄 New Game</button>
</section>

<section id="leaderboard" class="card hidden">
  <button class="secondary" onclick="goHome()">← Home</button>
  <h2>🏆 Top Players</h2>
  <div class="coins">Your Coins: <span id="lbCoins">0</span></div>
  <div id="leaderList">Loading...</div>
  <div class="note">Online leaderboard Firebase Firestore से चलता है.</div>
</section>

</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth, signInAnonymously, onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, setDoc, updateDoc, getDocs, collection,
  query, orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyAYcY9fnK9VKXePa39mNMCMc4Mrnw_UYIM",
  authDomain:"xoking-2a49b.firebaseapp.com",
  projectId:"xoking-2a49b",
  storageBucket:"xoking-2a49b.firebasestorage.app",
  messagingSenderId:"452125698114",
  appId:"1:452125698114:web:e3d71571795421dcfe25db"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let currentUser=null;
let playerReady=Promise.resolve();

window.firebaseReady=false;
window.firebaseUser=null;

async function ensurePlayerDoc(){
  if(!currentUser) return;
  const ref=doc(db,"leaderboard",currentUser.uid);
  try{
    await setDoc(ref,{
      playerId:currentUser.uid,
      name:localStorage.getItem("xoPlayerName")||"",
      wins:0,games:0,coins:0,
      updatedAt:serverTimestamp()
    },{merge:true});
  }catch(e){
    console.error(e);
  }
}

onAuthStateChanged(auth,async user=>{
  currentUser=user;
  window.firebaseUser=user;
  if(user){
    document.getElementById("playerId").textContent="XO-"+user.uid.slice(0,8).toUpperCase();
    document.getElementById("firebaseStatus").textContent="✅ Firebase Online";
    playerReady=ensurePlayerDoc();
    await playerReady;
    window.firebaseReady=true;
    window.loadOnlineLeaderboard();
  }else{
    document.getElementById("firebaseStatus").textContent="❌ Firebase Offline";
  }
});

signInAnonymously(auth).catch(e=>{
  console.error(e);
  document.getElementById("firebaseStatus").textContent="❌ Anonymous Login Error";
});

window.savePlayerOnline=async function(){
  await playerReady;
  if(!currentUser) return;
  const ref=doc(db,"leaderboard",currentUser.uid);
  await setDoc(ref,{
    playerId:currentUser.uid,
    name:localStorage.getItem("xoPlayerName")||"Player",
    wins:Number(localStorage.getItem("xoTotalWins")||0),
    games:Number(localStorage.getItem("xoTotalGames")||0),
    coins:Number(localStorage.getItem("xoKingCoins")||0),
    updatedAt:serverTimestamp()
  },{merge:true});
};

window.loadOnlineLeaderboard=async function(){
  const box=document.getElementById("leaderList");
  try{
    const q=query(collection(db,"leaderboard"),orderBy("wins","desc"),limit(20));
    const snap=await getDocs(q);
    if(snap.empty){box.innerHTML="<p>अभी कोई player नहीं है.</p>";return;}
    let i=1,html="";
    snap.forEach(d=>{
      const p=d.data();
      const short=(p.playerId||"").slice(0,8).toUpperCase();
      html+=`<div class="lbrow"><span>🏅 ${i++}. <b>${escapeHtml(p.name||"Player")}</b><br><small>XO-${short}</small></span><span>🏆 ${p.wins||0}<br>🪙 ${p.coins||0}</span></div>`;
    });
    box.innerHTML=html;
  }catch(e){
    console.error(e);
    box.innerHTML="<p>Leaderboard load नहीं हुआ. Firestore rules check करें.</p>";
  }
};

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
</script>

<script>
let board=Array(9).fill("");
let turn="X",gameOver=false,computerMode=false,level="hard";
let xScore=0,oScore=0;

const patterns=[
 [0,1,2],[3,4,5],[6,7,8],
 [0,3,6],[1,4,7],[2,5,8],
 [0,4,8],[2,4,6]
];

function getNum(key){return Number(localStorage.getItem(key)||0)}
function setNum(key,val){localStorage.setItem(key,String(val))}
function updateUI(){
  const c=getNum("xoKingCoins"),w=getNum("xoTotalWins"),g=getNum("xoTotalGames"),b=getNum("xoBestScore");
  document.getElementById("coins").textContent=c;
  document.getElementById("gameCoins").textContent=c;
  document.getElementById("lbCoins").textContent=c;
  document.getElementById("statCoins").textContent=c;
  document.getElementById("wins").textContent=w;
  document.getElementById("games").textContent=g;
  document.getElementById("best").textContent=b;
}
function saveName(){
  const name=document.getElementById("playerName").value.trim();
  if(!name){alert("पहले नाम लिखें.");return}
  localStorage.setItem("xoPlayerName",name);
  if(window.savePlayerOnline) window.savePlayerOnline().catch(console.error);
  alert("✅ नाम Save हो गया");
}
function addCoins(n){
  setNum("xoKingCoins",getNum("xoKingCoins")+n);
  updateUI();
  if(window.savePlayerOnline) window.savePlayerOnline().catch(console.error);
}
function setLevel(l){
  level=l;
  ["easy","medium","hard"].forEach(x=>document.getElementById(x).classList.remove("active"));
  document.getElementById(l).classList.add("active");
}
function show(id){
  ["home","game","leaderboard"].forEach(x=>document.getElementById(x).classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}
function goHome(){show("home");updateUI()}
function startComputer(){computerMode=true;newGame(false);show("game")}
function startTwoPlayer(){computerMode=false;newGame(false);show("game")}
function showLeaderboard(){show("leaderboard");updateUI();if(window.loadOnlineLeaderboard)window.loadOnlineLeaderboard()}

function renderBoard(){
  const el=document.getElementById("board");
  el.innerHTML="";
  board.forEach((v,i)=>{
    const c=document.createElement("div");
    c.className="cell";
    c.textContent=v;
    c.onclick=()=>move(i);
    el.appendChild(c);
  });
  document.getElementById("status").textContent=gameOver?"Game Over":turn+" की चाल";
  document.getElementById("xScore").textContent=xScore;
  document.getElementById("oScore").textContent=oScore;
  updateUI();
}
function move(i){
  if(gameOver||board[i])return;
  board[i]=turn;
  renderBoard();
  if(finishIfNeeded())return;
  turn=turn==="X"?"O":"X";
  renderBoard();
  if(computerMode&&turn==="O")setTimeout(computerMove,300);
}
function checkWinner(b=board){
  for(const [a,c,d] of patterns){
    if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];
  }
  if(b.every(Boolean))return "draw";
  return null;
}
function finishIfNeeded(){
  const result=checkWinner();
  if(!result)return false;
  gameOver=true;
  let msg="";
  let games=getNum("xoTotalGames")+1;
  setNum("xoTotalGames",games);
  if(result==="X"){
    xScore++;setNum("xoTotalWins",getNum("xoTotalWins")+1);
    setNum("xoBestScore",Math.max(getNum("xoBestScore"),xScore));
    addCoins(10);msg="🎉 X जीत गया! +10 Coins";
  }else if(result==="O"){
    oScore++;msg="⭕ O जीत गया!";
  }else{
    addCoins(2);msg="🤝 Draw! +2 Coins";
  }
  document.getElementById("message").textContent=msg;
  if(window.savePlayerOnline)window.savePlayerOnline().catch(console.error);
  renderBoard();
  return true;
}

function newGame(reward=true){
  if(reward)addCoins(1);
  board=Array(9).fill("");
  turn="X";gameOver=false;
  document.getElementById("message").textContent="";
  renderBoard();
}

function computerMove(){
  if(gameOver)return;
  let i;
  if(level==="easy")i=randomMove();
  else if(level==="medium")i=mediumMove();
  else i=bestMove();
  if(i!==undefined&&i!==-1){
    board[i]="O";renderBoard();
    if(finishIfNeeded())return;
    turn="X";renderBoard();
  }
}
function randomMove(){
  const a=board.map((v,i)=>v?null:i).filter(v=>v!==null);
  return a.length?a[Math.floor(Math.random()*a.length)]:-1;
}
function mediumMove(){
  for(let i=0;i<9;i++)if(!board[i]){
    board[i]="O";if(checkWinner()==="O"){board[i]="";return i}board[i]="";
  }
  for(let i=0;i<9;i++)if(!board[i]){
    board[i]="X";if(checkWinner()==="X"){board[i]="";return i}board[i]="";
  }
  if(!board[4])return 4;
  return randomMove();
}
function bestMove(){
  let best=-Infinity,move=-1;
  for(let i=0;i<9;i++)if(!board[i]){
    board[i]="O";
    const score=minimax(board,false);
    board[i]="";
    if(score>best){best=score;move=i}
  }
  return move;
}
function minimax(b,isMax){
  const r=checkWinner(b);
  if(r==="O")return 10;
  if(r==="X")return -10;
  if(r==="draw")return 0;
  if(isMax){
    let best=-Infinity;
    for(let i=0;i<9;i++)if(!b[i]){
      b[i]="O";best=Math.max(best,minimax(b,false));b[i]="";
    }
    return best;
  }else{
    let best=Infinity;
    for(let i=0;i<9;i++)if(!b[i]){
      b[i]="X";best=Math.min(best,minimax(b,true));b[i]="";
    }
    return best;
  }
}

document.getElementById("playerName").value=localStorage.getItem("xoPlayerName")||"";
updateUI();
</script>
</body>
</html>
